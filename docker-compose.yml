# Cenário honesto vs malicioso, 6 nós mock (cabe no notebook da equipe).
# Rede estrela: orquestrador fala com cada nó.

services:
  node-0:
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
    environment:
      NODE_ID: node-0
      PROFILE: honest
      INFERENCE_MODE: mock
      SEED: "10"

  node-1:
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
    environment:
      NODE_ID: node-1
      PROFILE: honest
      INFERENCE_MODE: mock
      SEED: "11"

  node-2:
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
    environment:
      NODE_ID: node-2
      PROFILE: honest
      INFERENCE_MODE: mock
      SEED: "12"

  node-3:
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
    environment:
      NODE_ID: node-3
      PROFILE: honest
      INFERENCE_MODE: mock
      SEED: "13"

  node-4:
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
    environment:
      NODE_ID: node-4
      PROFILE: malicious
      INFERENCE_MODE: mock
      SEED: "14"
      MALICIOUS_VALUE: "999"

  node-5:
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
    environment:
      NODE_ID: node-5
      PROFILE: malicious
      INFERENCE_MODE: mock
      SEED: "15"
      MALICIOUS_VALUE: "999"

  orchestrator:
    build:
      context: .
      dockerfile: sistema/orchestrator/Dockerfile
    depends_on:
      - node-0
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5
    volumes:
      - ./sistema/results:/app/sistema/results
    command: ["python", "-m", "sistema.orchestrator.run", "--config", "sistema/config/experiment.yaml"]
