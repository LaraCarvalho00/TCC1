services:
  node-0:
    environment:
      NODE_ID: node-0
      PROFILE: malicious
      INFERENCE_MODE: mock
      SEED: '10'
      HONEST_P_CORRECT: '0.9'
      UNSTABLE_P_DROP: '0.3'
      UNSTABLE_P_CORRECT: '0.5'
      MALICIOUS_VALUE: '999'
      MAX_SLEEP_MS: '200'
      PEERS: node-0,node-1,node-2,node-3
      NEIGHBORS: node-1,node-2
      TOPOLOGY: kregular
      DEGREE: '2'
      GRAPH_SEED: '10'
      SIGNAL: hybrid
      MECHANISM: ema
      ALPHA: '0.3'
      INITIAL_REPUTATION: '0.5'
      TEST_EVERY: '10'
      DEFENSE: all
      LEADER_ATTACK: none
      AUDITOR_ATTACK: none
      COLLUDERS: node-0
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
  node-1:
    environment:
      NODE_ID: node-1
      PROFILE: honest
      INFERENCE_MODE: mock
      SEED: '11'
      HONEST_P_CORRECT: '0.9'
      UNSTABLE_P_DROP: '0.3'
      UNSTABLE_P_CORRECT: '0.5'
      MAX_SLEEP_MS: '200'
      PEERS: node-0,node-1,node-2,node-3
      NEIGHBORS: node-0,node-3
      TOPOLOGY: kregular
      DEGREE: '2'
      GRAPH_SEED: '10'
      SIGNAL: hybrid
      MECHANISM: ema
      ALPHA: '0.3'
      INITIAL_REPUTATION: '0.5'
      TEST_EVERY: '10'
      DEFENSE: all
      LEADER_ATTACK: none
      AUDITOR_ATTACK: none
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
  node-2:
    environment:
      NODE_ID: node-2
      PROFILE: honest
      INFERENCE_MODE: mock
      SEED: '12'
      HONEST_P_CORRECT: '0.9'
      UNSTABLE_P_DROP: '0.3'
      UNSTABLE_P_CORRECT: '0.5'
      MAX_SLEEP_MS: '200'
      PEERS: node-0,node-1,node-2,node-3
      NEIGHBORS: node-0,node-3
      TOPOLOGY: kregular
      DEGREE: '2'
      GRAPH_SEED: '10'
      SIGNAL: hybrid
      MECHANISM: ema
      ALPHA: '0.3'
      INITIAL_REPUTATION: '0.5'
      TEST_EVERY: '10'
      DEFENSE: all
      LEADER_ATTACK: none
      AUDITOR_ATTACK: none
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
  node-3:
    environment:
      NODE_ID: node-3
      PROFILE: honest
      INFERENCE_MODE: mock
      SEED: '13'
      HONEST_P_CORRECT: '0.9'
      UNSTABLE_P_DROP: '0.3'
      UNSTABLE_P_CORRECT: '0.5'
      MAX_SLEEP_MS: '200'
      PEERS: node-0,node-1,node-2,node-3
      NEIGHBORS: node-1,node-2
      TOPOLOGY: kregular
      DEGREE: '2'
      GRAPH_SEED: '10'
      SIGNAL: hybrid
      MECHANISM: ema
      ALPHA: '0.3'
      INITIAL_REPUTATION: '0.5'
      TEST_EVERY: '10'
      DEFENSE: all
      LEADER_ATTACK: none
      AUDITOR_ATTACK: none
    build:
      context: .
      dockerfile: sistema/node/Dockerfile
  orchestrator:
    depends_on:
    - node-0
    - node-1
    - node-2
    - node-3
    volumes:
    - ./sistema/results:/app/sistema/results
    - ./sistema/config:/app/sistema/config
    command:
    - python
    - -m
    - sistema.orchestrator.run
    - --config
    - sistema/config/experiment.yaml
    build:
      context: .
      dockerfile: sistema/orchestrator/Dockerfile
